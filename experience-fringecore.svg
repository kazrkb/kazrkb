<text class="sans" x="48" y="146" font-size="19" fill="#A3ADC2">FringeCore (City Group), Dhaka</text>
<text class="sans" x="48" y="192" font-size="16" fill="#A3ADC2">An end-to-end retail system that tracks product</text>
<text class="sans" x="48" y="216" font-size="16" fill="#A3ADC2">availability and stock in every shop, from shelf photos.</text>
<text class="sans" x="48" y="284" font-size="34" fill="#F3F5FA" font-weight="700" letter-spacing="-1">96%</text>
