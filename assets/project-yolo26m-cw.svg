<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="YOLO26m-CW: riverine waste detection, mmAP 0.672">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.p1{animation-delay:.35s}.p2{animation-delay:.7s}.p3{animation-delay:1.05s}.p4{animation-delay:1.4s}.p5{animation-delay:1.75s}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.heat{transform-box:fill-box;transform-origin:center;animation:heat 3.2s ease-in-out infinite}
@keyframes heat{0%,100%{opacity:.75;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.wave{animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(-60px)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="hot" x1="0" x2="1"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#FF4D6D"/></linearGradient>
<radialGradient id="cam" cx=".5" cy=".5" r=".5">
 <stop offset="0" stop-color="#FFE08A" stop-opacity=".95"/><stop offset=".35" stop-color="#FF8A1F" stop-opacity=".75"/>
 <stop offset=".7" stop-color="#E0245E" stop-opacity=".35"/><stop offset="1" stop-color="#E0245E" stop-opacity="0"/></radialGradient>
<radialGradient id="lung" cx=".5" cy=".45" r=".52">
 <stop offset="0" stop-color="#C9D3E6" stop-opacity=".18"/><stop offset=".7" stop-color="#C9D3E6" stop-opacity=".06"/>
 <stop offset="1" stop-color="#C9D3E6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1C2436"/></pattern>
</defs>
<rect width="600" height="360" rx="20" fill="#0B0F1A"/>
<rect x=".5" y=".5" width="599" height="359" rx="19.5" fill="none" stroke="#1E2638"/>
<text class="mono" x="36" y="54" font-size="13" fill="#FFB020" letter-spacing="1.2">OBJECT DETECTION · FICTA 2026</text>
<text class="sans" x="34" y="98" font-size="30" fill="#F3F5FA" font-weight="700" letter-spacing="-.8">YOLO26m-CW</text>
<text class="sans" x="36" y="138" font-size="16" fill="#A3ADC2">Custom YOLO detector with Coordinate Attention and</text>
<text class="sans" x="36" y="162" font-size="16" fill="#A3ADC2">water-specific augmentation for river waste monitoring.</text>
<line x1="36" y1="196" x2="564" y2="196" stroke="#1E2638"/>
<text class="sans" x="36" y="248" font-size="30" fill="#F3F5FA" font-weight="700" letter-spacing="-.8">0.672</text>
<text class="mono" x="36" y="274" font-size="14" fill="#6B7590">mmAP</text>
<text class="sans" x="216" y="248" font-size="30" fill="#F3F5FA" font-weight="700" letter-spacing="-.8">+23.8</text>
<text class="mono" x="216" y="274" font-size="14" fill="#6B7590">vs Cascade R-CNN</text>
<text class="sans" x="396" y="248" font-size="30" fill="#F3F5FA" font-weight="700" letter-spacing="-.8">&gt;0.90</text>
<text class="mono" x="396" y="274" font-size="14" fill="#6B7590">mAP50, 5 splits</text>
<line x1="36" y1="304" x2="564" y2="304" stroke="#1E2638"/>
<text class="mono" x="36" y="334" font-size="13" fill="#6B7590">Dec 2025  ·  3 external datasets</text>
<text class="mono" x="564" y="334" font-size="13" fill="#5EEAD4" text-anchor="end">case study ↗</text>
<g>
<clipPath id="wc"><rect x="446" y="26" width="122" height="100" rx="10"/></clipPath>
<rect x="446" y="26" width="122" height="100" rx="10" fill="#05070D" stroke="#1E2638"/>
<g clip-path="url(#wc)"><path class="wave" d="M440 92 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0" fill="none" stroke="#5EEAD4" stroke-opacity="0.5" stroke-width="2"/><path class="wave" d="M440 104 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0" fill="none" stroke="#5EEAD4" stroke-opacity="0.3" stroke-width="2"/><path class="wave" d="M440 116 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0 q15 -8 30 0 t30 0" fill="none" stroke="#5EEAD4" stroke-opacity="0.18" stroke-width="2"/>
<g class="bob"><rect x="468" y="66" width="16" height="22" rx="3" fill="#2C3A55"/><path class="pulse" d="M463 67 v-6 h6 M483 61 h6 v6 M489 87 v6 h-6 M469 93 h-6 v-6" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round"/></g>
<g class="bob" style="animation-delay:1.2s"><rect x="516" y="74" width="26" height="14" rx="4" fill="#3A2F24"/><path class="pulse" d="M511 75 v-6 h6 M541 69 h6 v6 M547 87 v6 h-6 M517 93 h-6 v-6" fill="none" stroke="#FFB020" stroke-width="1.5" stroke-linecap="round"/></g>
</g>
<text class="mono" x="458" y="46" font-size="10" fill="#6B7590">river cam</text></g>
</svg>
