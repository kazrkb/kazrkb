<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Key results: 96% SKU accuracy, AUC 0.973, 3.2 ms per request, +23.8 mmAP, 4 papers">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.p1{animation-delay:.35s}.p2{animation-delay:.7s}.p3{animation-delay:1.05s}.p4{animation-delay:1.4s}.p5{animation-delay:1.75s}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.heat{transform-box:fill-box;transform-origin:center;animation:heat 3.2s ease-in-out infinite}
@keyframes heat{0%,100%{opacity:.75;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.wave{animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(-60px)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="hot" x1="0" x2="1"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#FF4D6D"/></linearGradient>
<radialGradient id="cam" cx=".5" cy=".5" r=".5">
 <stop offset="0" stop-color="#FFE08A" stop-opacity=".95"/><stop offset=".35" stop-color="#FF8A1F" stop-opacity=".75"/>
 <stop offset=".7" stop-color="#E0245E" stop-opacity=".35"/><stop offset="1" stop-color="#E0245E" stop-opacity="0"/></radialGradient>
<radialGradient id="lung" cx=".5" cy=".45" r=".52">
 <stop offset="0" stop-color="#C9D3E6" stop-opacity=".18"/><stop offset=".7" stop-color="#C9D3E6" stop-opacity=".06"/>
 <stop offset="1" stop-color="#C9D3E6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1C2436"/></pattern>
</defs>
<rect width="1200" height="150" rx="20" fill="#0B0F1A"/>
<rect x=".5" y=".5" width="1199" height="149" rx="19.5" fill="none" stroke="#1E2638"/>
<rect x="34.0" y="34" width="18" height="3" rx="1.5" fill="url(#hot)"/>
<text class="sans" x="34.0" y="82" font-size="38" fill="#F3F5FA" font-weight="700" letter-spacing="-1">96%</text>
<text class="mono" x="34.0" y="106" font-size="13" fill="#A3ADC2">SKU accuracy</text>
<text class="mono" x="34.0" y="124" font-size="13" fill="#6B7590">91 product classes</text>
<line x1="240.0" y1="30" x2="240.0" y2="120" stroke="#1E2638"/>
<rect x="274.0" y="34" width="18" height="3" rx="1.5" fill="url(#hot)"/>
<text class="sans" x="274.0" y="82" font-size="38" fill="#F3F5FA" font-weight="700" letter-spacing="-1">0.973</text>
<text class="mono" x="274.0" y="106" font-size="13" fill="#A3ADC2">AUC</text>
<text class="mono" x="274.0" y="124" font-size="13" fill="#6B7590">pneumonia detection</text>
<line x1="480.0" y1="30" x2="480.0" y2="120" stroke="#1E2638"/>
<rect x="514.0" y="34" width="18" height="3" rx="1.5" fill="url(#hot)"/>
<text class="sans" x="514.0" y="82" font-size="38" fill="#F3F5FA" font-weight="700" letter-spacing="-1">3.2 ms</text>
<text class="mono" x="514.0" y="106" font-size="13" fill="#A3ADC2">per request</text>
<text class="mono" x="514.0" y="124" font-size="13" fill="#6B7590">on AWS</text>
<line x1="720.0" y1="30" x2="720.0" y2="120" stroke="#1E2638"/>
<rect x="754.0" y="34" width="18" height="3" rx="1.5" fill="url(#hot)"/>
<text class="sans" x="754.0" y="82" font-size="38" fill="#F3F5FA" font-weight="700" letter-spacing="-1">+23.8</text>
<text class="mono" x="754.0" y="106" font-size="13" fill="#A3ADC2">mmAP over</text>
<text class="mono" x="754.0" y="124" font-size="13" fill="#6B7590">Cascade R-CNN</text>
<line x1="960.0" y1="30" x2="960.0" y2="120" stroke="#1E2638"/>
<rect x="994.0" y="34" width="18" height="3" rx="1.5" fill="url(#hot)"/>
<text class="sans" x="994.0" y="82" font-size="38" fill="#F3F5FA" font-weight="700" letter-spacing="-1">4</text>
<text class="mono" x="994.0" y="106" font-size="13" fill="#A3ADC2">peer-reviewed</text>
<text class="mono" x="994.0" y="124" font-size="13" fill="#6B7590">papers in 2026</text>
</svg>
