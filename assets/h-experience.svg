<style>@font-face{font-family:Inter;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}.draw{stroke-dasharray:1 1;animation:draw1 6s cubic-bezier(.65,.05,.35,1) infinite}.d1{animation-name:draw1}@keyframes draw1{0%,0%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}.d2{animation-name:draw2}@keyframes draw2{0%,6%{stroke-dashoffset:1}28%,100%{stroke-dashoffset:0}}.d3{animation-name:draw3}@keyframes draw3{0%,12%{stroke-dashoffset:1}34%,100%{stroke-dashoffset:0}}.d4{animation-name:draw4}@keyframes draw4{0%,18%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}.d5{animation-name:draw5}@keyframes draw5{0%,24%{stroke-dashoffset:1}46%,100%{stroke-dashoffset:0}}.d6{animation-name:draw6}@keyframes draw6{0%,30%{stroke-dashoffset:1}52%,100%{stroke-dashoffset:0}}.wig{transform-box:fill-box;transform-origin:center;animation:wig 2.8s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.08);opacity:1}}.p1{animation-delay:.4s}.p2{animation-delay:.8s}.p3{animation-delay:1.2s}.scan{animation:scan 4.5s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--dy))}}.scanx{animation:scanx 5s ease-in-out infinite}@keyframes scanx{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--dx))}}.flowx{animation:flowx 3s linear infinite}@keyframes flowx{to{transform:translateX(-40px)}}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite}@keyframes grow{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1)}}.dash{stroke-dasharray:6 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-13}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
