<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 636" width="1200" height="636" role="img" aria-label="Publications: MIET 2026: A Modular Zero-Shot Framework for Multi-Domain Medical Diagnosis via MobileSAM and BiomedCLIP; FICTA 2026: YOLO26m-CW: A Water-Augmented Spatial Attention Framework for Robust Riverine Waste Monitoring; ICEFronT 2026: Establishing Machine Learning Benchmarks for Type-2 Diabetes Mellitus Prediction in Bangladesh; ECCT 2026: Device-Independent Human Activity Recognition across Wearable Sensors in an IoT Framework">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.p1{animation-delay:.5s}.p2{animation-delay:1s}.p3{animation-delay:1.5s}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.sweep{animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1400px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
